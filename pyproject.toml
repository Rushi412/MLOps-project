[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-learning-platform"
version = "0.1.0"
description = "A local-first MLOps learning platform with reproducible ML examples."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "scikit-learn>=1.5,<2.0",
  "pandas>=2.2,<3.0",
  "joblib>=1.4,<2.0",
  "mlflow>=2.16,<4.0",
  "boto3>=1.35,<2.0",
  "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
