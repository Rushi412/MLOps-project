name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
  portfolio-link-check:
    runs-on: ubuntu-latest
    if: ${{ vars.PORTFOLIO_URL != '' }}
    steps:
      - run: curl --fail --head --location "${{ vars.PORTFOLIO_URL }}"

